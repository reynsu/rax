rules:
  - id: rax.sec.hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: const $X = "$VAL"
          - pattern: let $X = "$VAL"
          - pattern: var $X = "$VAL"
      - metavariable-regex:
          metavariable: $X
          regex: ".*(?i)(jwt|api[-_]?key|secret|access[-_]?token|client[-_]?secret|bearer).*"
      - metavariable-regex:
          metavariable: $VAL
          regex: "^[A-Za-z0-9+/=_\\-]{16,}$"
    message: |
      The variable name and value shape suggest a hardcoded secret. Move it
      to an env var loaded at runtime, and rotate the leaked credential —
      git history retains it even after deletion.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      iso_sub_id: ISO_SEC_CONF
      rax_v1_id: SEC-1
      cwe: "CWE-798"
